name: Schedule bot

on:
  schedule:
    - cron: "*/10 * * * *"  # «будильник»: ставит следующий запуск в очередь
  workflow_dispatch:         # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write            # чтобы бот мог сохранять state/ в репозиторий

concurrency:
  group: telegram-bot        # одновременно работает только одна копия бота,
  cancel-in-progress: false  # следующая ждёт в очереди и стартует сразу после неё

jobs:
  bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
        with:
          # берём самую свежую версию ветки, а не ту, что была в момент постановки в очередь
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          RUN_SECONDS: "3300"  # 55 минут работы за один запуск
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          mkdir -p state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if git diff --cached --quiet; then
            echo "Состояние не изменилось"
          else
            git commit -m "Обновление состояния бота"
            git pull --rebase
            git push
          fi
